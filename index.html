<header>
  <h1>JOB TIME</h1>
  <p>ระบบแจ้งเตือนการปฏิบัติงาน</p>
</header>

<main>

  <!-- =====================================================
       PUSH NOTIFICATION
  ====================================================== -->

  <section class="card push-box">

    <button
      class="btn-blue"
      onclick="enablePush()">
      เปิดใช้งานการแจ้งเตือน

    <div id="pushStatus" class="push-status">

  <!-- =====================================================
       ADD JOB
  ====================================================== -->

  <section class="card">

    <div class="card-title">➕ เพิ่ม Job</div>

    <label for="jobNumber">เลข Job</label>

      placeholder="เช่น JOB-001">

      id="jobDate"
      type="date">

    <label for="jobTime">เวลา</label>
    <input
      id="jobTime"
      type="time">

    <label for="jobRemark">Remark</label>
    <textarea
      id="jobRemark"
      placeholder="รายละเอียดงาน / สถานที่ / หมายเหตุ"></textarea>

    <button
      class="btn-primary"
      onclick="addJob()">
      เพิ่ม Job
    </button>

  </section>

       ACTIVE JOB
  ====================================================== -->

    <div class="card-title">⏱️ Job ที่กำลังปฏิบัติงาน</div>

      <div class="empty">
        ยังไม่มี Job ที่กำลังปฏิบัติงาน
      </div>
    </div>

  </section>


  <!-- =====================================================
       TODAY JOB
  ====================================================== -->

  <section class="card">

    <div class="card-title">📋 Job วันนี้</div>

    <div id="todayJobs"></div>

  </section>


  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <section class="card">

    <div class="card-title">🔎 ค้นหา Job</div>

    <input
      id="searchJob"
      class="search-box"
      type="search"
      placeholder="ค้นหาเลข Job หรือ Remark..."
      oninput="renderSearch()">

    <div id="searchResults"></div>

  </section>


  <!-- =====================================================
       HISTORY
  ====================================================== -->

  <section class="card">

    <div class="card-title">📚 ประวัติ Job</div>

    <div id="history"></div>

  </section>

</main>


<script>
/* =====================================================
   JOB TIME
===================================================== */

const STORAGE_KEY = "job_time_jobs";

const DEPARTED_MINUTES = 40;
const ONSITE_MINUTES = 115;
const DONE_MINUTES = 25;

let jobs = loadJobs();


/* =====================================================
   LOAD / SAVE
===================================================== */

function loadJobs() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (error) {
    console.error(error);
    return [];
  }
}

function saveJobs() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(jobs)
  );
}


/* =====================================================
   DATE / TIME
===================================================== */

function formatDateTime(timestamp) {

  if (!timestamp) return "-";

  const date = new Date(timestamp);

  return date.toLocaleString("th-TH", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}


function todayString() {

  const d = new Date();

  const year = d.getFullYear();

  const month = String(
    d.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    d.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


/* =====================================================
   ADD JOB
===================================================== */

function addJob() {

  const jobNumber =
    document.getElementById("jobNumber").value.trim();

  const date =
    document.getElementById("jobDate").value;

  const time =
    document.getElementById("jobTime").value;

  const remark =
    document.getElementById("jobRemark").value.trim();

  if (!jobNumber) {
    alert("กรุณาระบุเลข Job");
    return;
  }

  if (!date) {
    alert("กรุณาระบุวันที่");
    return;
  }

  if (!time) {
    alert("กรุณาระบุเวลา");
    return;
  }

  const job = {

    id:
      Date.now().toString(),

    jobNumber,

    date,

    time,

    remark,

    status: "WAITING",

    created_at: Date.now(),

    departed_at: null,

    onsite_at: null,

    done_at: null,

    leave_at: null,

    completed: false

  };

  jobs.unshift(job);

  saveJobs();

  document.getElementById("jobNumber").value = "";
  document.getElementById("jobRemark").value = "";

  renderAll();

  alert("เพิ่ม Job เรียบร้อยแล้ว");
}


/* =====================================================
   START DEPARTED
===================================================== */

function startDeparted(id) {

  const job = jobs.find(
    item => item.id === id
  );

  if (!job) return;

  job.status = "DEPARTED";

  job.departed_at = Date.now();

  saveJobs();

  notifyLocal(
    "🚗 DEPARTED",
    `Job ${job.jobNumber} เริ่มเดินทางแล้ว`
  );

  renderAll();
}


/* =====================================================
   ONSITE
===================================================== */

function setOnsite(id) {

  const job = jobs.find(
    item => item.id === id
  );

  if (!job) return;

  job.status = "ONSITE";

  job.onsite_at = Date.now();

  saveJobs();

  notifyLocal(
    "📍 ONSITE",
    `Job ${job.jobNumber} ถึงหน้างานแล้ว`
  );

  renderAll();
}


/* =====================================================
   DONE
===================================================== */

function setDone(id) {

  const job = jobs.find(
    item => item.id === id
  );

  if (!job) return;

  job.status = "DONE";

  job.done_at = Date.now();

  saveJobs();

  notifyLocal(
    "✅ DONE",
    `Job ${job.jobNumber} ทำงานเสร็จแล้ว`
  );

  renderAll();
}


/* =====================================================
   LEAVE
===================================================== */

function setLeave(id) {

  const job = jobs.find(
    item => item.id === id
  );

  if (!job) return;

  job.status = "LEAVE";

  job.leave_at = Date.now();

  job.completed = true;

  saveJobs();

  notifyLocal(
    "🏁 LEAVE",
    `Job ${job.jobNumber} เสร็จสมบูรณ์`
  );

  renderAll();
}


/* =====================================================
   STATUS TEXT
===================================================== */

function statusText(status) {

  const map = {

    WAITING: "รอเริ่มงาน",

    DEPARTED: "กำลังเดินทาง",

    ONSITE: "อยู่หน้างาน",

    DONE: "ทำงานเสร็จ",

    LEAVE: "ออกจากหน้างาน"

  };

  return map[status] || status;
}


/* =====================================================
   COUNTDOWN
===================================================== */

function getCountdown(job) {

  let startTime = null;

  let duration = 0;

  if (
    job.status === "DEPARTED" &&
    job.departed_at
  ) {

    startTime = job.departed_at;

    duration = DEPARTED_MINUTES * 60 * 1000;

  } else if (
    job.status === "ONSITE" &&
    job.onsite_at
  ) {

    startTime = job.onsite_at;

    duration = ONSITE_MINUTES * 60 * 1000;

  } else if (
    job.status === "DONE" &&
    job.done_at
  ) {

    startTime = job.done_at;

    duration = DONE_MINUTES * 60 * 1000;

  } else {

    return null;
  }

  const remaining =
    duration -
    (Date.now() - startTime);

  return Math.max(
    0,
    Math.floor(remaining / 1000)
  );
}


function formatCountdown(seconds) {

  if (seconds === null) {
    return "--:--:--";
  }

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  return [
    h,
    m,
    s
  ]
    .map(
      n => String(n).padStart(2, "0")
    )
    .join(":");
}


/* =====================================================
   ACTIVE JOB
===================================================== */

function renderActiveJob() {

  const container =
    document.getElementById("activeJob");

  const job =
    jobs.find(
      item =>
        !item.completed &&
        (
          item.status === "DEPARTED" ||
          item.status === "ONSITE" ||
          item.status === "DONE"
        )
    );

  if (!job) {

    container.innerHTML = `
      <div class="empty">
        ยังไม่มี Job ที่กำลังปฏิบัติงาน
      </div>
    `;

    return;
  }

  const countdown =
    getCountdown(job);

  let action = "";

  if (job.status === "DEPARTED") {

    action = `
      <button
        class="btn-blue"
        onclick="setOnsite('${job.id}')">
        📍 ONSITE
      </button>
    `;

  } else if (job.status === "ONSITE") {

    action = `
      <button
        class="btn-green"
        onclick="setDone('${job.id}')">
        ✅ DONE
      </button>
    `;

  } else if (job.status === "DONE") {

    action = `
      <button
        class="btn-orange"
        onclick="setLeave('${job.id}')">
        🏁 LEAVE
      </button>
    `;
  }

  container.innerHTML = `

    <div class="job-card">

      <div class="job-number">
        JOB: ${escapeHtml(job.jobNumber)}
      </div>

      <div class="remark">
        ${escapeHtml(job.remark || "-")}
      </div>

      <div class="status">
        ${statusText(job.status)}
      </div>

      <div class="timer">
        ${formatCountdown(countdown)}
      </div>

      <div class="time-info">

        DEPARTED:
        ${formatDateTime(job.departed_at)}
        <br>

        ONSITE:
        ${formatDateTime(job.onsite_at)}
        <br>

        DONE:
        ${formatDateTime(job.done_at)}
        <br>

        LEAVE:
        ${formatDateTime(job.leave_at)}

      </div>

      ${action}

    </div>
  `;
}


/* =====================================================
   TODAY JOBS
===================================================== */

function renderTodayJobs() {

  const container =
    document.getElementById("todayJobs");

  const today =
    todayString();

  const todayJobs =
    jobs.filter(
      job => job.date === today
    );

  if (!todayJobs.length) {

    container.innerHTML = `
      <div class="empty">
        วันนี้ยังไม่มี Job
      </div>
    `;

    return;
  }

  container.innerHTML =
    todayJobs.map(job => {

      let button = "";

      if (
        job.status === "WAITING" &&
        !job.completed
      ) {

        button = `
          <button
            class="btn-primary"
            onclick="startDeparted('${job.id}')">
            🚗 DEPARTED
          </button>
        `;

      } else if (job.completed) {

        button = `
          <div class="status">
            ✅ COMPLETED
          </div>
        `;
      }

      return `

        <div class="job-card">

          <div class="job-number">
            ${escapeHtml(job.jobNumber)}
          </div>

          <div class="remark">
            ${escapeHtml(job.remark || "-")}
          </div>

          <div class="status">
            ${statusText(job.status)}
          </div>

          <div class="time-info">
            เวลา Job: ${escapeHtml(job.time)}
          </div>

          ${button}

        </div>
      `;

    }).join("");
}


/* =====================================================
   SEARCH
===================================================== */

function renderSearch() {

  const keyword =
    document
      .getElementById("searchJob")
      .value
      .trim()
      .toLowerCase();

  const container =
    document.getElementById("searchResults");

  if (!keyword) {

    container.innerHTML = `
      <div class="empty">
        พิมพ์เลข Job หรือ Remark เพื่อค้นหา
      </div>
    `;

    return;
  }

  const results =
    jobs.filter(job => {

      return (

        job.jobNumber
          .toLowerCase()
          .includes(keyword)

        ||

        (job.remark || "")
          .toLowerCase()
          .includes(keyword)

      );

    });

  if (!results.length) {

    container.innerHTML = `
      <div class="empty">
        ไม่พบ Job
      </div>
    `;

    return;
  }

  container.innerHTML =
    results.map(job => `

      <div class="job-card">

        <div class="job-number">
          ${escapeHtml(job.jobNumber)}
        </div>

        <div class="remark">
          ${escapeHtml(job.remark || "-")}
        </div>

        <div class="status">
          ${statusText(job.status)}
        </div>

        <div class="time-info">
          วันที่: ${escapeHtml(job.date)}
          <br>
          เวลา: ${escapeHtml(job.time)}
          <br>
          DEPARTED: ${formatDateTime(job.departed_at)}
          <br>
          ONSITE: ${formatDateTime(job.onsite_at)}
          <br>
          DONE: ${formatDateTime(job.done_at)}
          <br>
          LEAVE: ${formatDateTime(job.leave_at)}
        </div>

      </div>

    `).join("");
}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {

  const container =
    document.getElementById("history");

  const completedJobs =
    jobs.filter(
      job =>
        job.completed ||
        job.status === "LEAVE"
    );

  if (!completedJobs.length) {

    container.innerHTML = `
      <div class="empty">
        ยังไม่มีประวัติ Job
      </div>
    `;

    return;
  }

  container.innerHTML =
    completedJobs.map(job => `

      <div class="history-item">

        <div class="history-job">
          JOB: ${escapeHtml(job.jobNumber)}
        </div>

        <div>
          ${escapeHtml(job.remark || "-")}
        </div>

        <div class="history-time">

          วันที่:
          ${escapeHtml(job.date)}

          <br>

          DEPARTED:
          ${formatDateTime(job.departed_at)}

          <br>

          ONSITE:
          ${formatDateTime(job.onsite_at)}

          <br>

          DONE:
          ${formatDateTime(job.done_at)}

          <br>

          LEAVE:
          ${formatDateTime(job.leave_at)}

        </div>

      </div>

    `).join("");
}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll() {

  renderActiveJob();

  renderTodayJobs();

  renderSearch();

  renderHistory();
}


/* =====================================================
   LOCAL NOTIFICATION
===================================================== */

function notifyLocal(title, body) {

  try {

    if (
      "Notification" in window &&
      Notification.permission === "granted"
    ) {

      new Notification(
        title,
        {
          body: body,
          icon: "./icon-192.png"
        }
      );

    }

  } catch (error) {

    console.error(
      "Notification error:",
      error
    );

  }
}


/* =====================================================
   ONESIGNAL PUSH
===================================================== */

async function enablePush() {

  const status =
    document.getElementById("pushStatus");

  try {

    if (!window.OneSignalDeferred) {

      status.textContent =
        "กำลังโหลดระบบแจ้งเตือน กรุณาลองอีกครั้ง";

      return;
    }

    OneSignalDeferred.push(
      async function(OneSignal) {

        try {

          await OneSignal.User.PushSubscription.optIn();

          status.innerHTML =
            "✅ เปิดใช้งานการแจ้งเตือนแล้ว";

        } catch (error) {

          console.error(error);

          status.innerHTML =
            "⚠️ ยังไม่สามารถเปิดการแจ้งเตือนได้";

        }

      }
    );

  } catch (error) {

    console.error(error);

    status.textContent =
      "เกิดข้อผิดพลาดในการเปิด Push";
  }
}


/* =====================================================
   CHECK PUSH
===================================================== */

function checkPushStatus() {

  const status =
    document.getElementById("pushStatus");

  if (!("Notification" in window)) {

    status.innerHTML =
      "อุปกรณ์นี้ไม่รองรับ Notification";

    return;
  }

  if (Notification.permission === "granted") {

    status.innerHTML =
      "🔔 ระบบแจ้งเตือนพร้อมใช้งาน";

  } else if (
    Notification.permission === "denied"
  ) {

    status.innerHTML =
      "⚠️ การแจ้งเตือนถูกปิดไว้ใน Settings ของ iPhone";

  } else {

    status.innerHTML =
      "กดปุ่มด้านบนเพื่อเปิดใช้งานการแจ้งเตือน";
  }
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");
}


/* =====================================================
   SERVICE WORKER
===================================================== */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    async function() {

      try {

        await navigator.serviceWorker.register(
          "./service-worker.js"
        );

        console.log(
          "[JOB TIME] Service Worker registered"
        );

      } catch (error) {

        console.error(
          "[JOB TIME] Service Worker error:",
          error
        );

      }

    }
  );
}


/* =====================================================
   TIMER
===================================================== */

setInterval(
  function() {

    renderActiveJob();

  },
  1000
);


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const dateInput =
      document.getElementById("jobDate");

    if (dateInput) {
      dateInput.value =
        todayString();
    }

    renderAll();

    checkPushStatus();

  }
);

</script>
