<style>

}

body{

              sans-serif;

}

h1{

}

.card{

  padding:18px;

  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,
textarea,
button{

  padding:13px;

  border-radius:10px;

  resize:vertical;

}

button{

}

button:active{
  transform:scale(.98);
}

.btn-blue{
  background:#2563eb;
}

.btn-green{
  background:#16a34a;
}

.btn-orange{
  background:#ea580c;
}

.btn-red{
  background:#dc2626;
}

.btn-gray{
  background:#6b7280;
}

.job-card{
  border-left:6px solid #2563eb;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;

}

.status.active{
  background:#dbeafe;
  color:#1d4ed8;
}

.status.done{
  background:#dcfce7;
  color:#166534;
}

.timer{
  font-size:42px;
  font-weight:bold;
  text-align:center;
  margin:15px 0;
}

.small{
  color:#6b7280;
  font-size:14px;
}

.history-item{
  padding:12px 0;
  border-bottom:1px solid #e5e7eb;
}

.history-item:last-child{
  border-bottom:none;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

#message{
  text-align:center;
  margin:10px 0;
  font-weight:bold;
}

.hidden{
  display:none;
}

</style>

</head>


<body>


<div class="container">


<h1>⏱️ JOB TIME</h1>


<!-- =====================================================
     PUSH NOTIFICATION
===================================================== -->

<div class="card">

<h2>🔔 การแจ้งเตือน</h2>

<p class="small">
เปิดใช้งาน Web Push เพื่อรับการแจ้งเตือนจาก JOB TIME
</p>

<button
  class="btn-blue"
  onclick="enablePush()">

🔔 เปิดใช้งาน Web Push

</button>

<div id="pushStatus"
     class="small"
     style="margin-top:10px;">
ยังไม่ได้เปิดใช้งาน
</div>

</div>



<!-- =====================================================
     ADD JOB
===================================================== -->

<div class="card">

<h2>➕ เพิ่ม Job</h2>


<label>
เลข Job
</label>

<input
  id="jobNumber"
  type="text"
  placeholder="เช่น JOB-001">


<label>
วันที่
</label>

<input
  id="jobDate"
  type="date">


<label>
เวลา
</label>

<input
  id="jobTime"
  type="time">


<label>
Remark
</label>

<textarea
  id="jobRemark"
  placeholder="รายละเอียดงาน"></textarea>


<button
  class="btn-green"
  onclick="addJob()">

เพิ่ม Job

</button>

</div>



<!-- =====================================================
     ACTIVE JOB
===================================================== -->

<div
  id="activeJobSection"
  class="card hidden">

<h2>🚧 Job ที่กำลังปฏิบัติ</h2>

<div id="activeJob"></div>

</div>



<!-- =====================================================
     TODAY JOB
===================================================== -->

<div class="card">

<h2>📋 Job วันนี้</h2>

<div id="todayJobs"></div>

</div>



<!-- =====================================================
     SEARCH
===================================================== -->

<div class="card">

<h2>🔎 ค้นหา Job</h2>

<input
  id="searchInput"
  type="text"
  placeholder="ค้นหาเลข Job หรือ Remark"
  oninput="searchJobs()">

<div id="searchResults"></div>

</div>



<!-- =====================================================
     HISTORY
===================================================== -->

<div class="card">

<h2>📚 ประวัติ Job</h2>

<div id="history"></div>

</div>


<div id="message"></div>


</div>



<script>


/* =====================================================
   STORAGE
===================================================== */

const JOB_STORAGE_KEY =
  "job_time_jobs";


const PUSH_STORAGE_KEY =
  "job_time_push_subscription";



/* =====================================================
   VAPID PUBLIC KEY
===================================================== */

const VAPID_PUBLIC_KEY =
  "BHdcwG22SK0Rqec8MSACS8wYVwnWHuXxrPj-rm4tOVQpvzWpL0COJeEmjy-gF5GmzU0AoorV9dR16DfFVIfAfOI";



/* =====================================================
   LOAD JOBS
===================================================== */

function getJobs(){

  try{

    return JSON.parse(
      localStorage.getItem(
        JOB_STORAGE_KEY
      )
    ) || [];

  }catch(error){

    console.error(error);

    return [];

  }

}



function saveJobs(jobs){

  localStorage.setItem(
    JOB_STORAGE_KEY,
    JSON.stringify(jobs)
  );

}



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  setTimeout(() => {

    message.textContent =
      "";

  },3000);

}



/* =====================================================
   ADD JOB
===================================================== */

function addJob(){

  const jobNumber =
    document.getElementById(
      "jobNumber"
    ).value.trim();


  const jobDate =
    document.getElementById(
      "jobDate"
    ).value;


  const jobTime =
    document.getElementById(
      "jobTime"
    ).value;


  const remark =
    document.getElementById(
      "jobRemark"
    ).value.trim();



  if(!jobNumber){

    alert(
      "กรุณาระบุเลข Job"
    );

    return;

  }


  if(!jobDate){

    alert(
      "กรุณาระบุวันที่"
    );

    return;

  }


  if(!jobTime){

    alert(
      "กรุณาระบุเวลา"
    );

    return;

  }



  const jobs =
    getJobs();


  const job = {

    id:
      Date.now(),

    jobNumber:
      jobNumber,

    date:
      jobDate,

    time:
      jobTime,

    remark:
      remark,

    status:
      "WAITING",

    departed_at:
      null,

    onsite_at:
      null,

    done_at:
      null,

    leave_at:
      null,

    completed:
      false

  };


  jobs.push(job);

  saveJobs(jobs);



  document.getElementById(
    "jobNumber"
  ).value="";


  document.getElementById(
    "jobDate"
  ).value="";


  document.getElementById(
    "jobTime"
  ).value="";


  document.getElementById(
    "jobRemark"
  ).value="";


  showMessage(
    "✅ เพิ่ม Job เรียบร้อย"
  );


  renderAll();

}



/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp){

  if(!timestamp){

    return "-";

  }


  const date =
    new Date(timestamp);


  return date.toLocaleString(
    "th-TH",
    {
      dateStyle:"short",
      timeStyle:"medium"
    }
  );

}



/* =====================================================
   FORMAT COUNTDOWN
===================================================== */

function formatCountdown(ms){

  if(ms <= 0){

    return "00:00:00";

  }


  const totalSeconds =
    Math.floor(ms / 1000);


  const hours =
    Math.floor(
      totalSeconds / 3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const seconds =
    totalSeconds % 60;


  return [

    String(hours).padStart(2,"0"),

    String(minutes).padStart(2,"0"),

    String(seconds).padStart(2,"0")

  ].join(":");

}



/* =====================================================
   GET ACTIVE JOB
===================================================== */

function getActiveJob(){

  const jobs =
    getJobs();


  return jobs.find(
    job =>
      job.status === "DEPARTED" ||
      job.status === "ONSITE" ||
      job.status === "DONE"
  ) || null;

}



/* =====================================================
   START DEPARTED
===================================================== */

function startDeparted(id){

  const jobs =
    getJobs();


  const active =
    jobs.find(
      job =>
        job.status === "DEPARTED" ||
        job.status === "ONSITE" ||
        job.status === "DONE"
    );


  if(active){

    alert(
      "มี Job ที่กำลังปฏิบัติงานอยู่แล้ว"
    );

    return;

  }


  const job =
    jobs.find(
      job =>
        job.id === id
    );


  if(!job){

    return;

  }


  job.status =
    "DEPARTED";


  job.departed_at =
    Date.now();


  saveJobs(jobs);


  sendLocalNotification(
    "🚗 DEPARTED",
    `Job ${job.jobNumber} ออกเดินทางแล้ว`
  );


  renderAll();

}



/* =====================================================
   ONSITE
===================================================== */

function setOnsite(id){

  const jobs =
    getJobs();


  const job =
    jobs.find(
      job =>
        job.id === id
    );


  if(!job){

    return;

  }


  job.status =
    "ONSITE";


  job.onsite_at =
    Date.now();


  saveJobs(jobs);


  sendLocalNotification(
    "📍 ONSITE",
    `Job ${job.jobNumber} ถึงหน้างานแล้ว`
  );


  renderAll();

}



/* =====================================================
   DONE
===================================================== */

function setDone(id){

  const jobs =
    getJobs();


  const job =
    jobs.find(
      job =>
        job.id === id
    );


  if(!job){

    return;

  }


  job.status =
    "DONE";


  job.done_at =
    Date.now();


  saveJobs(jobs);


  sendLocalNotification(
    "✅ DONE",
    `Job ${job.jobNumber} ทำงานเสร็จแล้ว`
  );


  renderAll();

}



/* =====================================================
   LEAVE
===================================================== */

function setLeave(id){

  const jobs =
    getJobs();


  const job =
    jobs.find(
      job =>
        job.id === id
    );


  if(!job){

    return;

  }


  job.status =
    "LEAVE";


  job.leave_at =
    Date.now();


  job.completed =
    true;


  saveJobs(jobs);


  sendLocalNotification(
    "🏠 LEAVE",
    `Job ${job.jobNumber} ออกจากหน้างานแล้ว`
  );


  renderAll();

}



/* =====================================================
   ACTIVE JOB RENDER
===================================================== */

function renderActiveJob(){

  const section =
    document.getElementById(
      "activeJobSection"
    );


  const container =
    document.getElementById(
      "activeJob"
    );


  const job =
    getActiveJob();


  if(!job){

    section.classList.add(
      "hidden"
    );

    container.innerHTML =
      "";

    return;

  }


  section.classList.remove(
    "hidden"
  );


  let countdown =
    "";


  let nextButton =
    "";


  let startTime =
    null;


  let duration =
    0;



  if(job.status === "DEPARTED"){

    startTime =
      job.departed_at;

    duration =
      40 * 60 * 1000;


    nextButton = `

      <button
        class="btn-blue"
        onclick="setOnsite(${job.id})">

        📍 ONSITE

      </button>

    `;

  }



  if(job.status === "ONSITE"){

    startTime =
      job.onsite_at;

    duration =
      115 * 60 * 1000;


    nextButton = `

      <button
        class="btn-green"
        onclick="setDone(${job.id})">

        ✅ DONE

      </button>

    `;

  }



  if(job.status === "DONE"){

    startTime =
      job.done_at;

    duration =
      25 * 60 * 1000;


    nextButton = `

      <button
        class="btn-orange"
        onclick="setLeave(${job.id})">

        🏠 LEAVE

      </button>

    `;

  }



  const remaining =
    startTime
      ? startTime + duration - Date.now()
      : 0;


  countdown =
    formatCountdown(
      remaining
    );



  container.innerHTML = `

    <div class="job-card">

      <h3>
        Job ${job.jobNumber}
      </h3>

      <div class="status active">
        ${job.status}
      </div>

      <p>
        ${job.remark || "ไม่มี Remark"}
      </p>

      <div class="timer">
        ${countdown}
      </div>

      <p class="small">
        เริ่มเวลา:
        ${formatTime(startTime)}
      </p>

      ${nextButton}

    </div>

  `;

}



/* =====================================================
   TODAY JOBS
===================================================== */

function renderTodayJobs(){

  const container =
    document.getElementById(
      "todayJobs"
    );


  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  const jobs =
    getJobs()
      .filter(
        job =>
          job.date === today
      );


  if(jobs.length === 0){

    container.innerHTML =
      `<p class="small">
        ยังไม่มี Job วันนี้
      </p>`;

    return;

  }



  container.innerHTML =
    jobs.map(
      job => `

      <div class="history-item">

        <strong>
          ${job.jobNumber}
        </strong>

        <div>
          ${job.time}
        </div>

        <div class="small">
          ${job.remark || "ไม่มี Remark"}
        </div>

        <div
          class="status
          ${job.completed ? "done" : ""}">

          ${job.status}

        </div>


        ${
          job.status === "WAITING"
          ?
          `
          <button
            onclick="startDeparted(${job.id})">

            🚗 DEPARTED

          </button>
          `
          :
          ""
        }

      </div>

      `
    )
    .join("");

}



/* =====================================================
   SEARCH
===================================================== */

function searchJobs(){

  const keyword =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const container =
    document.getElementById(
      "searchResults"
    );


  if(!keyword){

    container.innerHTML =
      "";

    return;

  }


  const jobs =
    getJobs()
      .filter(
        job =>

          job.jobNumber
            .toLowerCase()
            .includes(keyword)

          ||

          (job.remark || "")
            .toLowerCase()
            .includes(keyword)

      );


  if(jobs.length === 0){

    container.innerHTML =
      `<p class="small">
        ไม่พบ Job
      </p>`;

    return;

  }


  container.innerHTML =
    jobs.map(
      job => `

      <div class="history-item">

        <strong>
          ${job.jobNumber}
        </strong>

        <div>
          ${job.date}
          ${job.time}
        </div>

        <div>
          ${job.status}
        </div>

        <div class="small">
          ${job.remark || ""}
        </div>

      </div>

      `
    )
    .join("");

}



/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  const container =
    document.getElementById(
      "history"
    );


  const jobs =
    getJobs()
      .filter(
        job =>
          job.completed === true
      )
      .sort(
        (a,b) =>
          (b.leave_at || 0)
          -
          (a.leave_at || 0)
      );


  if(jobs.length === 0){

    container.innerHTML =
      `<p class="small">
        ยังไม่มีประวัติ Job
      </p>`;

    return;

  }


  container.innerHTML =
    jobs.map(
      job => `

      <div class="history-item">

        <strong>
          Job ${job.jobNumber}
        </strong>

        <div>
          📅 ${job.date}
        </div>

        <div>
          🕐 ${job.time}
        </div>

        <div>
          📝 ${job.remark || "ไม่มี Remark"}
        </div>

        <div class="small">

          DEPARTED:
          ${formatTime(job.departed_at)}

          <br>

          ONSITE:
          ${formatTime(job.onsite_at)}

          <br>

          DONE:
          ${formatTime(job.done_at)}

          <br>

          LEAVE:
          ${formatTime(job.leave_at)}

        </div>

      </div>

      `
    )
    .join("");

}



/* =====================================================
   RENDER ALL
===================================================== */

function renderAll(){

  renderActiveJob();

  renderTodayJobs();

  renderHistory();

  searchJobs();

}



/* =====================================================
   LOCAL NOTIFICATION
===================================================== */

async function sendLocalNotification(
  title,
  body
){

  try{

    if(
      "Notification"
      in window
      &&
      Notification.permission ===
      "granted"
    ){

      new Notification(
        title,
        {
          body:
            body
        }
      );

    }

  }catch(error){

    console.error(
      error
    );

  }

}



/* =====================================================
   VAPID BASE64URL CONVERTER
===================================================== */

function urlBase64ToUint8Array(
  base64String
){

  const padding =
    "=".repeat(
      (4 -
        base64String.length % 4
      ) % 4
    );


  const base64 =
    (
      base64String +
      padding
    )
      .replace(
        /-/g,
        "+"
      )
      .replace(
        /_/g,
        "/"
      );


  const rawData =
    window.atob(
      base64
    );


  return Uint8Array.from(
    [...rawData].map(
      char =>
        char.charCodeAt(0)
    )
  );

}



/* =====================================================
   ENABLE WEB PUSH
===================================================== */

async function enablePush(){

  const status =
    document.getElementById(
      "pushStatus"
    );


  try{

    status.textContent =
      "กำลังเปิดใช้งาน Web Push...";



    /* ---------------------------------------------
       CHECK NOTIFICATION
    --------------------------------------------- */

    if(
      !("Notification" in window)
    ){

      throw new Error(
        "อุปกรณ์นี้ไม่รองรับ Notification"
      );

    }



    /* ---------------------------------------------
       REQUEST PERMISSION
    --------------------------------------------- */

    const permission =
      await Notification.requestPermission();


    if(
      permission !==
      "granted"
    ){

      throw new Error(
        "ไม่ได้รับอนุญาตให้ส่ง Notification"
      );

    }



    /* ---------------------------------------------
       CHECK SERVICE WORKER
    --------------------------------------------- */

    if(
      !("serviceWorker" in navigator)
    ){

      throw new Error(
        "Browser ไม่รองรับ Service Worker"
      );

    }



    /* ---------------------------------------------
       REGISTER SERVICE WORKER
    --------------------------------------------- */

    const registration =
      await navigator.serviceWorker.register(
        "./service-worker.js"
      );


    await navigator.serviceWorker.ready;



    /* ---------------------------------------------
       CHECK PUSH
    --------------------------------------------- */

    if(
      !("PushManager" in window)
    ){

      throw new Error(
        "อุปกรณ์นี้ไม่รองรับ Web Push"
      );

    }



    /* ---------------------------------------------
       CHECK EXISTING SUBSCRIPTION
    --------------------------------------------- */

    let subscription =
      await registration.pushManager.getSubscription();



    /* ---------------------------------------------
       CREATE SUBSCRIPTION
    --------------------------------------------- */

    if(!subscription){

      subscription =
        await registration.pushManager.subscribe({

          userVisibleOnly:
            true,

          applicationServerKey:
            urlBase64ToUint8Array(
              VAPID_PUBLIC_KEY
            )

        });

    }



    /* ---------------------------------------------
       SAVE SUBSCRIPTION
    --------------------------------------------- */

    localStorage.setItem(

      PUSH_STORAGE_KEY,

      JSON.stringify(
        subscription
      )

    );



    /* ---------------------------------------------
       SUCCESS
    --------------------------------------------- */

    status.innerHTML =
      "✅ Web Push Subscription สำเร็จ";


    console.log(
      "WEB PUSH SUBSCRIPTION:",
      JSON.stringify(
        subscription
      )
    );


    alert(
      "✅ เปิดใช้งาน Web Push สำเร็จ"
    );


  }catch(error){

    console.error(
      "Web Push Error:",
      error
    );


    status.textContent =
      "❌ Web Push ไม่สำเร็จ";


    alert(
      "Web Push ไม่สำเร็จ\n\n" +
      error.message
    );

  }

}



/* =====================================================
   CHECK PUSH STATUS
===================================================== */

function checkPushStatus(){

  const status =
    document.getElementById(
      "pushStatus"
    );


  const saved =
    localStorage.getItem(
      PUSH_STORAGE_KEY
    );


  if(saved){

    status.innerHTML =
      "✅ Web Push เปิดใช้งานแล้ว";

  }

}



/* =====================================================
   SERVICE WORKER
===================================================== */

if(
  "serviceWorker"
  in navigator
){

  navigator.serviceWorker
    .register(
      "./service-worker.js"
    )
    .then(
      registration => {

        console.log(
          "[JOB TIME] Service Worker registered:",
          registration.scope
        );

      }
    )
    .catch(
      error => {

        console.error(
          "[JOB TIME] Service Worker error:",
          error
        );

      }
    );

}



/* =====================================================
   TIMER UPDATE
===================================================== */

setInterval(
  () => {

    renderActiveJob();

  },
  1000
);



/* =====================================================
   INITIAL LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const today =
      new Date()
        .toISOString()
        .split("T")[0];


    document.getElementById(
      "jobDate"
    ).value =
      today;


    checkPushStatus();

    renderAll();

  }
);

</script>
