<script>

/* =====================================================
   DATA
===================================================== */

let jobs =
JSON.parse(
  localStorage.getItem("jobs") || "[]"
);


let notifiedJobs =
JSON.parse(
  localStorage.getItem("notifiedJobs") || "[]"
);


/* =====================================================
   SAVE
===================================================== */

function saveData() {

  localStorage.setItem(
    "jobs",
    JSON.stringify(jobs)
  );

  localStorage.setItem(
    "notifiedJobs",
    JSON.stringify(notifiedJobs)
  );
}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

  const now =
    new Date();


  document.getElementById(
    "clock"
  ).textContent =
    now.toLocaleTimeString("th-TH");


  document.getElementById(
    "date"
  ).textContent =
    now.toLocaleDateString(
      "th-TH",
      {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );
}


setInterval(
  updateClock,
  1000
);


updateClock();


/* =====================================================
   MODAL
===================================================== */

function openModal() {

  document.getElementById(
    "jobModal"
  ).style.display =
    "block";


  const now =
    new Date();


  document.getElementById(
    "jobDate"
  ).value =
    now.toISOString()
      .split("T")[0];


  document.getElementById(
    "jobTime"
  ).value =
    now.toTimeString()
      .slice(0,5);
}


function closeModal() {

  document.getElementById(
    "jobModal"
  ).style.display =
    "none";
}


/* =====================================================
   SAVE JOB
===================================================== */

function saveJob() {

  const jobNumber =
    document.getElementById(
      "jobNumber"
    ).value.trim();


  const date =
    document.getElementById(
      "jobDate"
    ).value;


  const time =
    document.getElementById(
      "jobTime"
    ).value;


  const remark =
    document.getElementById(
      "jobRemark"
    ).value.trim();


  if (!jobNumber) {

    alert(
      "กรุณาใส่เลข Job"
    );

    return;
  }


  const job = {

    id:
      Date.now().toString(),

    job_number:
      jobNumber,

    date:
      date,

    time:
      time,

    remark:
      remark,

    status:
      "pending",

    created_at:
      new Date().toISOString(),

    departed_at:
      null,

    onsite_at:
      null,

    done_at:
      null,

    leave_at:
      null,

    test_mode:
      false

  };


  jobs.push(job);


  saveData();


  closeModal();


  document.getElementById(
    "jobNumber"
  ).value = "";


  document.getElementById(
    "jobRemark"
  ).value = "";


  renderAll();
}


/* =====================================================
   DEPARTED
===================================================== */

async function departedJob(id) {

  const notificationReady =
    await enableNotifications();


  if (!notificationReady) {

    return;

  }


  const job =
    jobs.find(
      j => j.id === id
    );


  if (!job) return;


  job.status =
    "departed";


  job.departed_at =
    new Date().toISOString();


  job.test_mode =
    false;


  resetNotification(job);


  saveData();


  renderAll();
}


/* =====================================================
   ONSITE
===================================================== */

async function onsiteJob(id) {

  const job =
    jobs.find(
      j => j.id === id
    );


  if (!job) return;


  job.status =
    "onsite";


  job.onsite_at =
    new Date().toISOString();


  resetNotification(job);


  saveData();


  renderAll();
}


/* =====================================================
   DONE
===================================================== */

async function doneJob(id) {

  const job =
    jobs.find(
      j => j.id === id
    );


  if (!job) return;


  job.status =
    "done";


  job.done_at =
    new Date().toISOString();


  resetNotification(job);


  saveData();


  renderAll();
}


/* =====================================================
   LEAVE
===================================================== */

function leaveJob(id) {

  const job =
    jobs.find(
      j => j.id === id
    );


  if (!job) return;


  job.status =
    "completed";


  job.leave_at =
    new Date().toISOString();


  saveData();


  renderAll();


  notifyUser(

    "🏁 JOB TIME",

    "JOB " +
    job.job_number +
    " เสร็จสิ้นแล้ว"

  );
}


/* =====================================================
   TARGET TIME
===================================================== */

function targetTime(job) {


  if (job.test_mode) {


    if (
      job.status ===
      "departed"
    ) {

      return new Date(
        job.departed_at
      ).getTime()
      +
      10 * 1000;

    }


    if (
      job.status ===
      "onsite"
    ) {

      return new Date(
        job.onsite_at
      ).getTime()
      +
      20 * 1000;

    }


    if (
      job.status ===
      "done"
    ) {

      return new Date(
        job.done_at
      ).getTime()
      +
      10 * 1000;

    }

  }


  if (
    job.status ===
    "departed"
  ) {

    return new Date(
      job.departed_at
    ).getTime()
    +
    40 * 60 * 1000;

  }


  if (
    job.status ===
    "onsite"
  ) {

    return new Date(
      job.onsite_at
    ).getTime()
    +
    115 * 60 * 1000;

  }


  if (
    job.status ===
    "done"
  ) {

    return new Date(
      job.done_at
    ).getTime()
    +
    25 * 60 * 1000;

  }


  return null;
}


/* =====================================================
   COUNTDOWN
===================================================== */

function countdown(job) {

  const target =
    targetTime(job);


  if (!target) {

    return "";

  }


  const remaining =
    Math.max(
      0,
      target - Date.now()
    );


  const totalSeconds =
    Math.floor(
      remaining / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  return (

    String(minutes)
      .padStart(2,"0")

    +

    ":"

    +

    String(seconds)
      .padStart(2,"0")

  );
}


/* =====================================================
   STATUS
===================================================== */

function statusText(status) {

  const map = {

    pending:
      "รอออกเดินทาง",

    departed:
      "🚗 กำลังเดินทาง",

    onsite:
      "📍 ถึงหน้างานแล้ว",

    done:
      "✅ ทำงานเสร็จแล้ว",

    completed:
      "🏁 เสร็จสิ้น"

  };


  return (
    map[status] ||
    status
  );
}


/* =====================================================
   CURRENT JOB
===================================================== */

function renderCurrentJob() {

  const container =
    document.getElementById(
      "currentJob"
    );


  const active =
    jobs.find(
      j =>
        j.status !==
        "completed"
    );


  if (!active) {

    container.innerHTML =
      '<div class="empty">' +
      'ยังไม่มี JOB ที่กำลังทำงาน' +
      '</div>';

    return;
  }


  let html = `

    <div class="job-number">

      ${escapeHTML(
        active.job_number
      )}

    </div>

    <div class="remark">

      ${escapeHTML(
        active.remark || "-"
      )}

    </div>

    <div class="status">

      ${statusText(
        active.status
      )}

    </div>

  `;


  if (

    active.status ===
      "departed"

    ||

    active.status ===
      "onsite"

    ||

    active.status ===
      "done"

  ) {

    html += `

      <div class="countdown">

        ${countdown(active)}

      </div>

    `;

  }


  if (
    active.status ===
    "pending"
  ) {

    html += `

      <button
        class="btn-blue"
        onclick="departedJob('${active.id}')">

        🚗 DEPARTED

      </button>

    `;

  }


  if (
    active.status ===
    "departed"
  ) {

    html += `

      <button
        class="btn-green"
        onclick="onsiteJob('${active.id}')">

        📍 ONSITE

      </button>

    `;

  }


  if (
    active.status ===
    "onsite"
  ) {

    html += `

      <button
        class="btn-orange"
        onclick="doneJob('${active.id}')">

        ✅ DONE

      </button>

    `;

  }


  if (
    active.status ===
    "done"
  ) {

    html += `

      <button
        class="btn-red"
        onclick="leaveJob('${active.id}')">

        🚪 LEAVE

      </button>

    `;

  }


  container.innerHTML =
    html;
}


/* =====================================================
   TODAY
===================================================== */

function renderToday() {

  const container =
    document.getElementById(
      "todayJobs"
    );


  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  const search =
    document.getElementById(
      "searchInput"
    ).value
      .toLowerCase();


  const list =
    jobs.filter(job => {


      const sameDay =
        job.date ===
        today;


      const match =

        job.job_number
          .toLowerCase()
          .includes(search)

        ||

        (
          job.remark ||
          ""
        )
        .toLowerCase()
        .includes(search);


      return (
        sameDay &&
        match
      );

    });


  if (!list.length) {

    container.innerHTML =
      '<div class="empty">' +
      'ยังไม่มีงานวันนี้' +
      '</div>';

    return;
  }


  container.innerHTML =

    list.map(job => `

      <div class="job-item">

        <strong>

          ${escapeHTML(
            job.job_number
          )}

        </strong>

        <div>

          ${escapeHTML(
            job.remark || "-"
          )}

        </div>

        <div class="small">

          ${job.date}
          ${job.time}

        </div>

        <div class="status">

          ${statusText(
            job.status
          )}

        </div>

      </div>

    `).join("");
}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory() {

  const container =
    document.getElementById(
      "history"
    );


  const list =
    jobs.filter(
      job =>
        job.status ===
        "completed"
    );


  if (!list.length) {

    container.innerHTML =
      '<div class="empty">' +
      'ยังไม่มีประวัติ' +
      '</div>';

    return;
  }


  container.innerHTML =

    list
      .slice()
      .reverse()
      .map(job => `

        <div class="job-item">

          <strong>

            ${escapeHTML(
              job.job_number
            )}

          </strong>

          <div>

            ${escapeHTML(
              job.remark || "-"
            )}

          </div>

          <div class="small">

            วันที่ ${job.date}

          </div>

          <div class="small">

            ออกจากหน้างาน:
            ${formatDateTime(
              job.leave_at
            )}

          </div>

        </div>

      `)
      .join("");
}


/* =====================================================
   ENABLE NOTIFICATION
===================================================== */

async function enableNotifications() {

  if (
    !("Notification" in window)
  ) {

    alert(
      "อุปกรณ์นี้ไม่รองรับ Notification"
    );

    return false;

  }


  if (
    Notification.permission ===
    "denied"
  ) {

    alert(
      "การแจ้งเตือนถูกปิดอยู่ กรุณาเปิดในการตั้งค่า iPhone"
    );

    updateNotificationStatus();

    return false;

  }


  try {

    let permission =
      Notification.permission;


    if (
      permission !==
      "granted"
    ) {

      permission =
        await Notification.requestPermission();

    }


    if (
      permission !==
      "granted"
    ) {

      updateNotificationStatus();

      return false;

    }


    updateNotificationStatus();


    /* =================================================
       REGISTER FIREBASE MESSAGING SERVICE WORKER
    ================================================= */

    const registration =
      await navigator.serviceWorker.register(
        "./firebase-messaging-sw.js",
        {
          scope: "./"
        }
      );


    await navigator.serviceWorker.ready;


    /* =================================================
       FIREBASE TOKEN
    ================================================= */

    const token =
      await firebaseMessaging.getToken({

        vapidKey:
          "BHdcwG22SK0Rqec8MSACS8wYVwnWHuXxrPj-rm4tOVQpvzWpL0COJeEmjy-gF5GmzU0AoorV9dR16DfFVIfAfOI",

        serviceWorkerRegistration:
          registration

      });


    if (token) {

      console.log(
        "JOB TIME FCM TOKEN:",
        token
      );


      localStorage.setItem(
        "fcmToken",
        token
      );


      showFCMToken(
        token
      );


      const status =
        document.getElementById(
          "notificationStatus"
        );


      status.innerHTML =

        '<span class="status-ok">' +

        '🟢 เปิดใช้งานการแจ้งเตือนแล้ว' +

        '<br><span class="small">' +

        'Firebase Push พร้อมใช้งาน' +

        '</span>' +

        '</span>';

    }

    else {

      console.warn(
        "ไม่พบ FCM Token"
      );

    }


    return true;


  }

  catch(error) {

    console.error(
      "Firebase Notification Error:",
      error
    );


    alert(

      "ไม่สามารถเชื่อมต่อ Firebase Notification ได้\n\n" +

      error.message

    );


    return false;

  }

}


/* =====================================================
   SHOW FCM TOKEN
===================================================== */

function showFCMToken(token) {

  const box =
    document.getElementById(
      "fcmTokenBox"
    );


  const input =
    document.getElementById(
      "fcmToken"
    );


  if (!box || !input) {

    return;

  }


  input.value =
    token || "";


  box.style.display =
    token
      ? "block"
      : "none";

}


/* =====================================================
   COPY FCM TOKEN
===================================================== */

async function copyFCMToken() {

  const input =
    document.getElementById(
      "fcmToken"
    );


  if (
    !input ||
    !input.value
  ) {

    alert(
      "ยังไม่มี Firebase Token"
    );

    return;

  }


  try {

    await navigator.clipboard.writeText(
      input.value
    );


    alert(
      "📋 คัดลอก Firebase Token แล้ว"
    );


  }

  catch(error) {

    input.select();


    document.execCommand(
      "copy"
    );


    alert(
      "📋 คัดลอก Firebase Token แล้ว"
    );

  }

}


/* =====================================================
   NOTIFICATION STATUS
===================================================== */

function updateNotificationStatus() {

  const element =
    document.getElementById(
      "notificationStatus"
    );


  if (!element) return;


  if (
    !("Notification" in window)
  ) {

    element.textContent =
      "❌ ไม่รองรับ Notification";

    return;

  }


  if (
    Notification.permission ===
    "granted"
  ) {

    element.innerHTML =

      '<span class="status-ok">' +

      '🟢 เปิดใช้งานการแจ้งเตือนแล้ว' +

      '</span>';

  }


  else if (
    Notification.permission ===
    "denied"
  ) {

    element.textContent =
      "🔴 การแจ้งเตือนถูกปิด";

  }


  else {

    element.textContent =
      "🟡 ยังไม่ได้อนุญาตการแจ้งเตือน";

  }

}


/* =====================================================
   TEST NOTIFICATION
===================================================== */

async function testNotification() {

  const granted =
    await enableNotifications();


  if (!granted) {

    return;

  }


  if (
    "serviceWorker" in navigator
  ) {

    try {

      const registration =
        await navigator.serviceWorker.register(
          "./firebase-messaging-sw.js",
          {
            scope: "./"
          }
        );


      await registration.showNotification(

        "🔔 JOB TIME",

        {

          body:
            "ทดสอบแจ้งเตือนสำเร็จ!",

          tag:
            "job-time-test",

          requireInteraction:
            true,

          vibrate:
            [300,200,300]

        }

      );


      showBanner(

        "🔔 ทดสอบสำเร็จ",

        "JOB TIME ส่ง Notification แล้ว"

      );


    }

    catch(error) {

      console.error(
        error
      );


      alert(
        "ไม่สามารถส่ง Notification ผ่าน Service Worker ได้\n\n" +
        error.message
      );

    }

  }

}


/* =====================================================
   TEST TIMER
===================================================== */

async function startTestTimer() {

  const granted =
    await enableNotifications();


  if (!granted) {

    return;

  }


  let active =
    jobs.find(
      job =>
        job.status !==
        "completed"
    );


  if (active) {

    const confirmUse =
      confirm(

        "มี JOB กำลังทำงานอยู่\n\n" +

        "ต้องการใช้ JOB นี้ทดสอบหรือไม่?"

      );


    if (!confirmUse) {

      return;

    }

  }


  if (!active) {

    active = {

      id:
        Date.now().toString(),

      job_number:
        "TEST-" +
        Math.floor(
          Math.random() * 10000
        ),

      date:
        new Date()
          .toISOString()
          .split("T")[0],

      time:
        new Date()
          .toTimeString()
          .slice(0,5),

      remark:
        "ทดสอบระบบแจ้งเตือน",

      status:
        "departed",

      created_at:
        new Date().toISOString(),

      departed_at:
        new Date().toISOString(),

      onsite_at:
        null,

      done_at:
        null,

      leave_at:
        null,

      test_mode:
        true

    };


    jobs.push(active);

  }

  else {

    active.test_mode =
      true;


    active.status =
      "departed";


    active.departed_at =
      new Date().toISOString();


    active.onsite_at =
      null;


    active.done_at =
      null;


    active.leave_at =
      null;


    resetNotification(
      active
    );

  }


  saveData();


  renderAll();


  showBanner(

    "🧪 TEST TIMER เริ่มแล้ว",

    "อีก 10 วินาที กรุณากด ONSITE"

  );

}


/* =====================================================
   CHECK TIMER
===================================================== */

function checkTimers() {

  const now =
    Date.now();


  jobs.forEach(job => {


    if (

      job.status !==
        "departed"

      &&

      job.status !==
        "onsite"

      &&

      job.status !==
        "done"

    ) {

      return;

    }


    const target =
      targetTime(job);


    if (!target) {

      return;

    }


    if (
      now >= target
    ) {


      let key = "";


      if (
        job.status ===
        "departed"
      ) {

        key =
          job.id +
          "-departed";

      }


      if (
        job.status ===
        "onsite"
      ) {

        key =
          job.id +
          "-onsite";

      }


      if (
        job.status ===
        "done"
      ) {

        key =
          job.id +
          "-done";

      }


      if (
        !notifiedJobs.includes(
          key
        )
      ) {


        notifiedJobs.push(
          key
        );


        saveData();


        if (
          job.status ===
          "departed"
        ) {

          notifyUser(

            "🚗 JOB TIME",

            "JOB " +
            job.job_number +
            " ถึงเวลาที่กำหนดแล้ว กรุณากด ONSITE"

          );

        }


        if (
          job.status ===
          "onsite"
        ) {

          notifyUser(

            "📍 JOB TIME",

            "JOB " +
            job.job_number +
            " ถึงเวลาที่กำหนดแล้ว กรุณากด DONE"

          );

        }


        if (
          job.status ===
          "done"
        ) {

          notifyUser(

            "✅ JOB TIME",

            "JOB " +
            job.job_number +
            " ถึงเวลาที่กำหนดแล้ว กรุณากด LEAVE"

          );

        }

      }

    }

  });


  renderCurrentJob();

}


setInterval(
  checkTimers,
  1000
);


/* =====================================================
   SEND NOTIFICATION
===================================================== */

function notifyUser(
  title,
  body
) {


  showBanner(
    title,
    body
  );


  if (
    "serviceWorker" in navigator
  ) {


    navigator
      .serviceWorker
      .ready

      .then(
        registration => {

          return registration
            .showNotification(

              title,

              {

                body:
                  body,

                tag:
                  "job-time-" +
                  Date.now(),

                requireInteraction:
                  true,

                vibrate:
                  [300,200,300]

              }

            );

        }

      )

      .catch(
        error => {

          console.error(
            error
          );

        }
      );

  }

}


/* =====================================================
   RESET NOTIFICATION
===================================================== */

function resetNotification(job) {

  notifiedJobs =
    notifiedJobs.filter(

      key =>
        !key.startsWith(
          job.id + "-"
        )

    );


  saveData();

}


/* =====================================================
   BANNER
===================================================== */

function showBanner(
  title,
  body
) {


  const old =
    document.getElementById(
      "notifyBanner"
    );


  if (old) {

    old.remove();

  }


  const banner =
    document.createElement(
      "div"
    );


  banner.id =
    "notifyBanner";


  banner.className =
    "banner";


  banner.innerHTML = `

    <strong>

      ${escapeHTML(title)}

    </strong>


    <div
      style="margin-top:6px">

      ${escapeHTML(body)}

    </div>


    <button
      onclick="

        document
          .getElementById(
            'notifyBanner'
          )
          .remove()

      ">

      ปิด

    </button>

  `;


  document.body.appendChild(
    banner
  );


  setTimeout(

    () => {

      const b =
        document.getElementById(
          "notifyBanner"
        );


      if (b) {

        b.remove();

      }

    },

    15000

  );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDateTime(
  value
) {

  if (!value) {

    return "-";

  }


  return new Date(value)
    .toLocaleString(
      "th-TH"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll() {

  renderCurrentJob();

  renderToday();

  renderHistory();

  updateNotificationStatus();

}


/* =====================================================
   MAIN SERVICE WORKER
===================================================== */

if (
  "serviceWorker" in navigator
) {


  window.addEventListener(
    "load",
    () => {


      navigator
        .serviceWorker
        .register(
          "./service-worker.js"
        )


        .then(
          registration => {


            console.log(

              "JOB TIME Service Worker พร้อมใช้งาน",

              registration

            );


            const savedToken =
              localStorage.getItem(
                "fcmToken"
              );


            if (savedToken) {

              showFCMToken(
                savedToken
              );

            }

          }

        )


        .catch(
          error => {


            console.error(

              "Service Worker Error:",

              error

            );

          }

        );

    }

  );

}


/* =====================================================
   FIREBASE FOREGROUND MESSAGE
===================================================== */

if (
  typeof firebaseMessaging !==
  "undefined"
) {


  firebaseMessaging.onMessage(
    payload => {


      console.log(
        "Firebase foreground message:",
        payload
      );


      const title =
        payload.notification?.title ||
        "🔔 JOB TIME";


      const body =
        payload.notification?.body ||
        "ถึงเวลาปฏิบัติงานแล้ว";


      showBanner(
        title,
        body
      );


    }
  );

}


/* =====================================================
   START
===================================================== */

renderAll();

</script>
