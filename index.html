<!DOCTYPE html>
<html lang="th">
<head>
<link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>JOB TIME</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  opacity: .8;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.clock {
  text-align: center;
}

#clock {
  font-size: 36px;
  font-weight: bold;
}

#date {
  color: #666;
}

h2 {
  margin-top: 0;
}

.job-number {
  font-size: 24px;
  font-weight: bold;
}

.remark {
  color: #555;
  margin: 8px 0;
}

.status {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 20px;
  background: #e5e7eb;
  margin: 5px 0;
  font-size: 14px;
}

.countdown {
  text-align: center;
  font-size: 38px;
  font-weight: bold;
  margin: 15px 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  margin-top: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.btn-main {
  background: #111827;
  color: white;
}

.btn-green {
  background: #16a34a;
  color: white;
}

.btn-blue {
  background: #2563eb;
  color: white;
}

.btn-orange {
  background: #f97316;
  color: white;
}

.btn-red {
  background: #dc2626;
  color: white;
}

.btn-test {
  background: #7c3aed;
  color: white;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin-top: 6px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

label {
  font-weight: bold;
  font-size: 14px;
}

.job-item {
  border-top: 1px solid #eee;
  padding: 14px 0;
}

.job-item:first-child {
  border-top: 0;
}

.search {
  margin-bottom: 10px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 20px;
}

.notification-test {
  background: #faf5ff;
  border: 1px solid #ddd6fe;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 1000;
  padding: 20px;
}

.modal-box {
  background: white;
  border-radius: 18px;
  padding: 20px;
  max-width: 500px;
  margin: 60px auto;
}

.small {
  font-size: 13px;
  color: #777;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.tabs button {
  margin: 0;
  background: #e5e7eb;
  color: #222;
}

.tabs button.active {
  background: #111827;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>⏰ JOB TIME</h1>
  <p>ระบบแจ้งเตือนการปฏิบัติงาน</p>
</header>

<div class="container">

  <!-- CLOCK -->
  <div class="card clock">
    <div id="clock">00:00:00</div>
    <div id="date">-</div>
  </div>

  <!-- CURRENT JOB -->
  <div class="card">
    <h2>📌 JOB ปัจจุบัน</h2>
    <div id="currentJob">
      <div class="empty">ยังไม่มี JOB ที่กำลังทำงาน</div>
    </div>
  </div>

  <!-- ADD JOB -->
  <div class="card">
    <button class="btn-main" onclick="openModal()">
      ＋ เพิ่ม Job
    </button>
  </div>

  <!-- NOTIFICATION -->
  <div class="card notification-test">
    <h2>🔔 ระบบแจ้งเตือน</h2>

    <p class="small">
      กดปุ่มด้านล่างเพื่อทดสอบว่าอุปกรณ์สามารถแสดงการแจ้งเตือนได้หรือไม่
    </p>

    <button class="btn-test" onclick="testNotification()">
      🔔 ทดสอบแจ้งเตือนทันที
    </button>

    <button class="btn-test" onclick="startTestTimer()">
      🧪 TEST TIMER
    </button>
  </div>

  <!-- TODAY -->
  <div class="card">
    <h2>📅 งานวันนี้</h2>

    <input
      class="search"
      id="searchInput"
      type="text"
      placeholder="🔎 ค้นหา Job หรือ Remark"
      oninput="renderToday()"
    >

    <div id="todayJobs"></div>
  </div>

  <!-- HISTORY -->
  <div class="card">
    <h2>📚 ประวัติ JOB</h2>

    <div id="history"></div>
  </div>

</div>

<!-- ADD JOB MODAL -->
<div class="modal" id="jobModal">

  <div class="modal-box">

    <h2>＋ เพิ่ม Job</h2>

    <label>เลข Job</label>
    <input id="jobNumber" placeholder="เช่น JOB-00125">

    <label>วันที่</label>
    <input id="jobDate" type="date">

    <label>เวลา</label>
    <input id="jobTime" type="time">

    <label>Remark</label>
    <textarea
      id="jobRemark"
      rows="3"
      placeholder="รายละเอียดงาน"
    ></textarea>

    <button class="btn-green" onclick="saveJob()">
      💾 บันทึก Job
    </button>

    <button class="btn-red" onclick="closeModal()">
      ยกเลิก
    </button>

  </div>

</div>

<script>

let jobs = JSON.parse(localStorage.getItem("jobs") || "[]");

let notifiedJobs =
  JSON.parse(localStorage.getItem("notifiedJobs") || "[]");


// =====================================================
// SAVE DATA
// =====================================================

function saveData() {

  localStorage.setItem(
    "jobs",
    JSON.stringify(jobs)
  );

  localStorage.setItem(
    "notifiedJobs",
    JSON.stringify(notifiedJobs)
  );
}


// =====================================================
// CLOCK
// =====================================================

function updateClock() {

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("th-TH");

  document.getElementById("date").textContent =
    now.toLocaleDateString(
      "th-TH",
      {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );
}

setInterval(updateClock,1000);

updateClock();


// =====================================================
// MODAL
// =====================================================

function openModal() {

  document.getElementById("jobModal").style.display = "block";

  const now = new Date();

  document.getElementById("jobDate").value =
    now.toISOString().split("T")[0];

  document.getElementById("jobTime").value =
    now.toTimeString().slice(0,5);
}


function closeModal() {

  document.getElementById("jobModal").style.display = "none";
}


// =====================================================
// ADD JOB
// =====================================================

function saveJob() {

  const jobNumber =
    document.getElementById("jobNumber").value.trim();

  const date =
    document.getElementById("jobDate").value;

  const time =
    document.getElementById("jobTime").value;

  const remark =
    document.getElementById("jobRemark").value.trim();


  if (!jobNumber) {

    alert("กรุณาใส่เลข Job");

    return;
  }


  const job = {

    id: Date.now().toString(),

    job_number: jobNumber,

    date: date,

    time: time,

    remark: remark,

    status: "pending",

    created_at: new Date().toISOString(),

    departed_at: null,

    onsite_at: null,

    done_at: null,

    leave_at: null

  };


  jobs.push(job);

  saveData();

  closeModal();

  document.getElementById("jobNumber").value = "";
  document.getElementById("jobRemark").value = "";

  renderAll();
}


// =====================================================
// DEPARTED
// =====================================================

async function departedJob(id) {

  await requestNotificationPermission();

  const job = jobs.find(j => j.id === id);

  if (!job) return;


  job.status = "departed";

  job.departed_at =
    new Date().toISOString();


  resetNotification(job);

  saveData();

  renderAll();
}


// =====================================================
// ONSITE
// =====================================================

async function onsiteJob(id) {

  await requestNotificationPermission();

  const job = jobs.find(j => j.id === id);

  if (!job) return;


  job.status = "onsite";

  job.onsite_at =
    new Date().toISOString();


  resetNotification(job);

  saveData();

  renderAll();
}


// =====================================================
// DONE
// =====================================================

async function doneJob(id) {

  await requestNotificationPermission();

  const job = jobs.find(j => j.id === id);

  if (!job) return;


  job.status = "done";

  job.done_at =
    new Date().toISOString();


  resetNotification(job);

  saveData();

  renderAll();
}


// =====================================================
// LEAVE
// =====================================================

async function leaveJob(id) {

  const job = jobs.find(j => j.id === id);

  if (!job) return;


  job.status = "completed";

  job.leave_at =
    new Date().toISOString();


  saveData();

  renderAll();

  notifyUser(
    "JOB TIME",
    "JOB " + job.job_number + " เสร็จสิ้นแล้ว"
  );
}


// =====================================================
// TARGET TIME
// =====================================================

function targetTime(job) {

  /*
    TEST MODE
    departed = 10 sec
    onsite   = 20 sec
    done     = 10 sec
  */

  if (job.test_mode) {

    if (job.status === "departed") {

      return new Date(job.departed_at).getTime()
        + 10 * 1000;
    }

    if (job.status === "onsite") {

      return new Date(job.onsite_at).getTime()
        + 20 * 1000;
    }

    if (job.status === "done") {

      return new Date(job.done_at).getTime()
        + 10 * 1000;
    }

    return null;
  }


  // REAL MODE

  if (job.status === "departed") {

    return new Date(job.departed_at).getTime()
      + 40 * 60 * 1000;
  }


  if (job.status === "onsite") {

    return new Date(job.onsite_at).getTime()
      + 115 * 60 * 1000;
  }


  if (job.status === "done") {

    return new Date(job.done_at).getTime()
      + 25 * 60 * 1000;
  }


  return null;
}


// =====================================================
// COUNTDOWN
// =====================================================

function countdown(job) {

  const target = targetTime(job);

  if (!target) return "";


  const remaining =
    Math.max(
      0,
      target - Date.now()
    );


  const totalSeconds =
    Math.floor(remaining / 1000);


  const minutes =
    Math.floor(totalSeconds / 60);


  const seconds =
    totalSeconds % 60;


  return String(minutes).padStart(2,"0")
    + ":"
    + String(seconds).padStart(2,"0");
}


// =====================================================
// STATUS TEXT
// =====================================================

function statusText(status) {

  const map = {

    pending: "รอออกเดินทาง",

    departed: "🚗 กำลังเดินทาง",

    onsite: "📍 ถึงหน้างานแล้ว",

    done: "✅ ทำงานเสร็จแล้ว",

    completed: "🏁 เสร็จสิ้น"

  };


  return map[status] || status;
}


// =====================================================
// CURRENT JOB
// =====================================================

function renderCurrentJob() {

  const container =
    document.getElementById("currentJob");


  const active =
    jobs.find(j =>
      j.status !== "completed"
    );


  if (!active) {

    container.innerHTML =
      '<div class="empty">ยังไม่มี JOB ที่กำลังทำงาน</div>';

    return;
  }


  let html = `

    <div class="job-number">
      ${escapeHTML(active.job_number)}
    </div>

    <div class="remark">
      ${escapeHTML(active.remark || "-")}
    </div>

    <div class="status">
      ${statusText(active.status)}
    </div>
  `;


  if (
    active.status === "departed" ||
    active.status === "onsite" ||
    active.status === "done"
  ) {

    html += `

      <div class="countdown">
        ${countdown(active)}
      </div>

    `;
  }


  if (active.status === "pending") {

    html += `

      <button
        class="btn-blue"
        onclick="departedJob('${active.id}')"
      >
        🚗 DEPARTED
      </button>

    `;
  }


  if (active.status === "departed") {

    html += `

      <button
        class="btn-green"
        onclick="onsiteJob('${active.id}')"
      >
        📍 ONSITE
      </button>

    `;
  }


  if (active.status === "onsite") {

    html += `

      <button
        class="btn-orange"
        onclick="doneJob('${active.id}')"
      >
        ✅ DONE
      </button>

    `;
  }


  if (active.status === "done") {

    html += `

      <button
        class="btn-red"
        onclick="leaveJob('${active.id}')"
      >
        🚪 LEAVE
      </button>

    `;
  }


  container.innerHTML = html;
}


// =====================================================
// TODAY
// =====================================================

function renderToday() {

  const container =
    document.getElementById("todayJobs");


  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();


  const list =
    jobs.filter(j => {

      const sameDay =
        j.date === today;


      const match =
        j.job_number
          .toLowerCase()
          .includes(search)
        ||
        (j.remark || "")
          .toLowerCase()
          .includes(search);


      return sameDay && match;
    });


  if (!list.length) {

    container.innerHTML =
      '<div class="empty">ยังไม่มีงานวันนี้</div>';

    return;
  }


  container.innerHTML =
    list.map(j => `

      <div class="job-item">

        <strong>
          ${escapeHTML(j.job_number)}
        </strong>

        <div>
          ${escapeHTML(j.remark || "-")}
        </div>

        <div class="small">
          ${j.date} ${j.time}
        </div>

        <div class="status">
          ${statusText(j.status)}
        </div>

      </div>

    `).join("");
}


// =====================================================
// HISTORY
// =====================================================

function renderHistory() {

  const container =
    document.getElementById("history");


  const list =
    jobs.filter(j =>
      j.status === "completed"
    );


  if (!list.length) {

    container.innerHTML =
      '<div class="empty">ยังไม่มีประวัติ</div>';

    return;
  }


  container.innerHTML =
    list.slice().reverse().map(j => `

      <div class="job-item">

        <strong>
          ${escapeHTML(j.job_number)}
        </strong>

        <div>
          ${escapeHTML(j.remark || "-")}
        </div>

        <div class="small">
          วันที่ ${j.date}
        </div>

        <div class="small">
          ออกจากหน้างาน:
          ${formatDateTime(j.leave_at)}
        </div>

      </div>

    `).join("");
}


// =====================================================
// NOTIFICATION PERMISSION
// =====================================================

async function requestNotificationPermission() {

  if (!("Notification" in window)) {

    return false;
  }


  if (Notification.permission === "granted") {

    return true;
  }


  if (Notification.permission === "denied") {

    return false;
  }


  try {

    const permission =
      await Notification.requestPermission();

    return permission === "granted";

  } catch(e) {

    return false;
  }
}


// =====================================================
// SEND NOTIFICATION
// =====================================================

function notifyUser(title, body) {

  // แจ้งเตือนบนหน้าเว็บเสมอ
  showBanner(title, body);


  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {

    try {

      new Notification(
        title,
        {
          body: body,
          icon: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
        }
      );

    } catch(e) {

      console.log(e);
    }
  }
}


// =====================================================
// TEST NOTIFICATION
// =====================================================

async function testNotification() {

  const granted =
    await requestNotificationPermission();


  if (granted) {

    notifyUser(
      "🔔 JOB TIME ทดสอบสำเร็จ",
      "ระบบแจ้งเตือนสามารถทำงานได้แล้ว"
    );

  } else {

    alert(
      "ตอนนี้ยังไม่ได้รับอนุญาตให้แจ้งเตือน\n\n" +
      "ถ้าไม่มีหน้าต่างขออนุญาต ให้เปิดการแจ้งเตือนของ Safari/เว็บไซต์ก่อน"
    );
  }
}


// =====================================================
// TEST TIMER
// =====================================================

async function startTestTimer() {

  await requestNotificationPermission();


  let active =
    jobs.find(j =>
      j.status !== "completed"
    );


  if (!active) {

    active = {

      id: Date.now().toString(),

      job_number: "TEST-" +
        Math.floor(Math.random() * 10000),

      date:
        new Date()
          .toISOString()
          .split("T")[0],

      time:
        new Date()
          .toTimeString()
          .slice(0,5),

      remark:
        "ทดสอบระบบแจ้งเตือน",

      status: "departed",

      created_at:
        new Date().toISOString(),

      departed_at:
        new Date().toISOString(),

      onsite_at: null,

      done_at: null,

      leave_at: null,

      test_mode: true

    };


    jobs.push(active);

  } else {

    active.test_mode = true;

    active.status = "departed";

    active.departed_at =
      new Date().toISOString();

    active.onsite_at = null;

    active.done_at = null;

    active.leave_at = null;
  }


  resetNotification(active);

  saveData();

  renderAll();


  showBanner(
    "🧪 TEST TIMER",
    "อีก 10 วินาที ระบบจะแจ้งเตือนให้กด ONSITE"
  );
}


// =====================================================
// CHECK TIMER
// =====================================================

function checkTimers() {

  const now = Date.now();


  jobs.forEach(job => {

    if (
      job.status !== "departed" &&
      job.status !== "onsite" &&
      job.status !== "done"
    ) {

      return;
    }


    const target =
      targetTime(job);


    if (!target) return;


    if (now >= target) {

      let key = "";


      if (job.status === "departed") {

        key = job.id + "-departed";

      }

      if (job.status === "onsite") {

        key = job.id + "-onsite";

      }

      if (job.status === "done") {

        key = job.id + "-done";

      }


      if (!notifiedJobs.includes(key)) {

        notifiedJobs.push(key);

        saveData();


        if (job.status === "departed") {

          notifyUser(
            "🚗 JOB TIME",
            "JOB " +
            job.job_number +
            " ถึงเวลาที่กำหนดแล้ว กรุณากด ONSITE"
          );
        }


        if (job.status === "onsite") {

          notifyUser(
            "📍 JOB TIME",
            "JOB " +
            job.job_number +
            " ถึงเวลาที่กำหนดแล้ว กรุณากด DONE"
          );
        }


        if (job.status === "done") {

          notifyUser(
            "✅ JOB TIME",
            "JOB " +
            job.job_number +
            " ถึงเวลาที่กำหนดแล้ว กรุณากด LEAVE"
          );
        }

      }

    }

  });


  renderCurrentJob();
}


setInterval(checkTimers,1000);


// =====================================================
// RESET NOTIFICATION
// =====================================================

function resetNotification(job) {

  notifiedJobs =
    notifiedJobs.filter(
      key => !key.startsWith(job.id + "-")
    );

  saveData();
}


// =====================================================
// BANNER
// =====================================================

function showBanner(title, body) {

  const old =
    document.getElementById("notifyBanner");

  if (old) old.remove();


  const banner =
    document.createElement("div");


  banner.id =
    "notifyBanner";


  banner.style.position =
    "fixed";

  banner.style.left =
    "15px";

  banner.style.right =
    "15px";

  banner.style.bottom =
    "20px";

  banner.style.zIndex =
    "9999";

  banner.style.background =
    "#111827";

  banner.style.color =
    "white";

  banner.style.padding =
    "18px";

  banner.style.borderRadius =
    "16px";

  banner.style.boxShadow =
    "0 5px 20px rgba(0,0,0,.3)";


  banner.innerHTML = `

    <strong>${escapeHTML(title)}</strong>

    <div style="margin-top:6px">
      ${escapeHTML(body)}
    </div>

    <button
      style="
        background:white;
        color:#111827;
        margin-top:10px;
      "
      onclick="document.getElementById('notifyBanner').remove()"
    >
      ปิด
    </button>

  `;


  document.body.appendChild(banner);


  setTimeout(() => {

    const b =
      document.getElementById("notifyBanner");

    if (b) b.remove();

  },15000);
}


// =====================================================
// FORMAT DATE
// =====================================================

function formatDateTime(value) {

  if (!value) return "-";


  return new Date(value)
    .toLocaleString("th-TH");
}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// =====================================================
// RENDER ALL
// =====================================================

function renderAll() {

  renderCurrentJob();

  renderToday();

  renderHistory();
}


renderAll();

</script>
<script>

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {

        console.log(
