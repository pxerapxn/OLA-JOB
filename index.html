<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOB TIME</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #f3f5f8;
  color: #111827;
}

.header {
  background: #111827;
  color: white;
  padding: 22px 18px;
  border-radius: 0 0 24px 24px;
}

.header h1 {
  margin: 0;
  font-size: 26px;
}

.header p {
  margin: 5px 0 0;
  opacity: .75;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 16px;
}

.clock {
  background: white;
  padding: 18px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 16px;
}

.clock-time {
  font-size: 34px;
  font-weight: 700;
}

.clock-date {
  color: #6b7280;
  margin-top: 5px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 16px;
}

.card-title {
  font-weight: 700;
  margin-bottom: 12px;
}

.job-number {
  font-size: 23px;
  font-weight: 700;
}

.remark {
  color: #6b7280;
  margin: 5px 0 12px;
}

.status {
  display: inline-block;
  padding: 7px 13px;
  border-radius: 20px;
  background: #fef3c7;
  color: #92400e;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 12px;
}

.countdown {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  margin: 12px 0;
}

button {
  border: none;
  border-radius: 13px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
}

.action {
  width: 100%;
  color: white;
}

.departed {
  background: #7c3aed;
}

.onsite {
  background: #2563eb;
}

.done {
  background: #16a34a;
}

.leave {
  background: #dc2626;
}

.add {
  width: 100%;
  background: #2563eb;
  color: white;
  font-size: 17px;
}

.job-item {
  padding: 14px 0;
  border-bottom: 1px solid #e5e7eb;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  align-items: flex-end;
}

.modal-box {
  background: white;
  width: 100%;
  padding: 22px;
  border-radius: 25px 25px 0 0;
}

.save {
  width: 100%;
  background: #2563eb;
  color: white;
}

.close {
  width: 100%;
  margin-top: 8px;
}

.hidden {
  display: none;
}

.nav {
  position: sticky;
  bottom: 0;
  display: flex;
  background: white;
  border-top: 1px solid #ddd;
}

.nav button {
  flex: 1;
  background: white;
}

</style>
</head>

<body>

<header class="header">
<h1>⏰ JOB TIME</h1>
<p>ระบบแจ้งเตือนและบันทึกการปฏิบัติงาน</p>
</header>

<main class="container">

<div class="clock">
<div class="clock-time" id="clock">00:00:00</div>
<div class="clock-date" id="date"></div>
</div>

<section id="homePage">

<div class="card">

<div class="card-title">
JOB ปัจจุบัน
</div>

<div id="currentJob">
ยังไม่มี Job
</div>

</div>

<button class="add" onclick="openModal()">
＋ เพิ่ม Job
</button>

<div class="card" style="margin-top:16px">

<div class="card-title">
งานวันนี้
</div>

<div id="todayJobs">
ยังไม่มี Job
</div>

</div>

</section>


<section id="historyPage" class="hidden">

<div class="card">

<div class="card-title">
📚 ประวัติ Job
</div>

<input
id="search"
placeholder="ค้นหา Job หรือ Remark..."
oninput="renderHistory()"
>

<div id="historyList"></div>

</div>

</section>

</main>


<nav class="nav">

<button onclick="showHome()">
🏠<br>งานวันนี้
</button>

<button onclick="showHistory()">
📚<br>ประวัติ
</button>

</nav>


<div class="modal" id="modal">

<div class="modal-box">

<h2>＋ เพิ่ม Job</h2>

<input
id="jobNumber"
placeholder="เลข Job"
>

<input
id="jobDate"
type="date"
>

<input
id="jobTime"
type="time"
>

<input
id="jobRemark"
placeholder="Remark"
>

<button class="save" onclick="saveJob()">
บันทึก Job
</button>

<button class="close" onclick="closeModal()">
ยกเลิก
</button>

</div>

</div>


<script>

let jobs = JSON.parse(
localStorage.getItem("jobs") || "[]"
);


/* CLOCK */

function clock() {

const now = new Date();

document.getElementById("clock").textContent =
now.toLocaleTimeString("th-TH");

document.getElementById("date").textContent =
now.toLocaleDateString(
"th-TH",
{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
}
);

}

setInterval(clock,1000);
clock();


/* SAVE */

function saveData() {

localStorage.setItem(
"jobs",
JSON.stringify(jobs)
);

}


/* MODAL */

function openModal() {

document.getElementById("modal")
.style.display="flex";

const now = new Date();

const date =
now.getFullYear()+"-"+
String(now.getMonth()+1).padStart(2,"0")+"-"+
String(now.getDate()).padStart(2,"0");

document.getElementById("jobDate").value=date;

}


function closeModal() {

document.getElementById("modal")
.style.display="none";

}


/* ADD JOB */

function saveJob() {

const number =
document.getElementById("jobNumber").value.trim();

const date =
document.getElementById("jobDate").value;

const time =
document.getElementById("jobTime").value;

const remark =
document.getElementById("jobRemark").value.trim();


if(!number || !date || !time) {

alert("กรุณากรอกเลข Job วันที่ และเวลา");

return;

}


jobs.push({

id:Date.now(),

job_number:number,

date:date,

time:time,

remark:remark,

status:"pending",

departed_at:null,

onsite_at:null,

done_at:null,

leave_at:null

});


saveData();

closeModal();

document.getElementById("jobNumber").value="";
document.getElementById("jobTime").value="";
document.getElementById("jobRemark").value="";

render();

}


/* DEPARTED */

function departedJob(id) {

const job=jobs.find(j=>j.id===id);

if(!job)return;

job.status="departed";

job.departed_at=new Date().toISOString();

saveData();

render();

}


/* ONSITE */

function onsiteJob(id) {

const job=jobs.find(j=>j.id===id);

if(!job)return;

job.status="onsite";

job.onsite_at=new Date().toISOString();

saveData();

render();

}


/* DONE */

function doneJob(id) {

const job=jobs.find(j=>j.id===id);

if(!job)return;

job.status="done";

job.done_at=new Date().toISOString();

saveData();

render();

}


/* LEAVE */

function leaveJob(id) {

const job=jobs.find(j=>j.id===id);

if(!job)return;

if(!confirm("ยืนยัน LEAVE Job นี้?"))return;

job.status="completed";

job.leave_at=new Date().toISOString();

saveData();

render();

}


/* TIMER */

function targetTime(job) {

if(job.status==="departed") {

return new Date(job.departed_at).getTime()
+40*60*1000;

}

if(job.status==="onsite") {

return new Date(job.onsite_at).getTime()
+115*60*1000;

}

if(job.status==="done") {

return new Date(job.done_at).getTime()
+25*60*1000;

}

return null;

}


/* COUNTDOWN */

function countdown(job) {

const target=targetTime(job);

if(!target)return "";

let diff=target-Date.now();

if(diff<=0)return "⏰ ถึงเวลาแล้ว";


let minutes=Math.floor(diff/60000);

let seconds=Math.floor(
(diff%60000)/1000
);

return "⏱ "+minutes+":"+
String(seconds).padStart(2,"0");

}


/* CURRENT JOB */

function renderCurrentJob() {

const box=document.getElementById("currentJob");

const job=jobs.find(
j=>j.status!=="completed"
);


if(!job) {

box.innerHTML="ยังไม่มี Job";

return;

}


let status="";
let button="";


if(job.status==="pending") {

status="รอ DEPARTED";

button=`
<button
class="action departed"
onclick="departedJob(${job.id})">
🚗 DEPARTED
</button>
`;

}


if(job.status==="departed") {

status="🚗 DEPARTED";

button=`
<button
class="action onsite"
onclick="onsiteJob(${job.id})">
📍 ONSITE
</button>
`;

}


if(job.status==="onsite") {

status="📍 ONSITE";

button=`
<button
class="action done"
onclick="doneJob(${job.id})">
✅ DONE
</button>
`;

}


if(job.status==="done") {

status="✅ DONE";

button=`
<button
class="action leave"
onclick="leaveJob(${job.id})">
🏁 LEAVE
</button>
`;

}


box.innerHTML=`

<div class="job-number">
${job.job_number}
</div>

<div class="remark">
${job.remark || "-"}
</div>

<div class="status">
${status}
</div>

${
job.status!=="pending"
?
`<div class="countdown">
${countdown(job)}
</div>`
:""
}

${button}

`;

}


/* TODAY */

function renderToday() {

const box=document.getElementById("todayJobs");

const today=new Date();

const date=
today.getFullYear()+"-"+
String(today.getMonth()+1).padStart(2,"0")+"-"+
String(today.getDate()).padStart(2,"0");


const list=jobs.filter(
j=>j.date===date
);


if(!list.length) {

box.innerHTML="วันนี้ยังไม่มี Job";

return;

}


box.innerHTML=list.map(j=>`

<div class="job-item">

<strong>
${j.time} — ${j.job_number}
</strong>

<span>
${j.remark || "-"}<br>
สถานะ: ${statusText(j.status)}
</span>

</div>

`).join("");

}


/* STATUS */

function statusText(status) {

if(status==="pending")return "รอ DEPARTED";
if(status==="departed")return "DEPARTED";
if(status==="onsite")return "ONSITE";
if(status==="done")return "DONE";
if(status==="completed")return "LEAVE / เสร็จแล้ว";

return status;

}


/* HISTORY */

function renderHistory() {

document.getElementById("homePage")
.classList.add("hidden");

document.getElementById("historyPage")
.classList.remove("hidden");


const search=
document.getElementById("search").value
.toLowerCase();


const list=jobs.filter(j=>
j.status==="completed" &&
(
j.job_number.toLowerCase().includes(search) ||
(j.remark||"").toLowerCase().includes(search)
)
);


const box=document.getElementById("historyList");


if(!list.length) {

box.innerHTML="ยังไม่มีประวัติ";

return;

}


box.innerHTML=list.reverse().map(j=>`

<div class="job-item">

<strong>${j.job_number}</strong>

<span>

${j.remark || "-"}<br>

วันที่: ${j.date}<br>

🚗 DEPARTED:
${formatTime(j.departed_at)}<br>

📍 ONSITE:
${formatTime(j.onsite_at)}<br>

✅ DONE:
${formatTime(j.done_at)}<br>

🏁 LEAVE:
${formatTime(j.leave_at)}

</span>

</div>

`).join("");

}


/* FORMAT TIME */

function formatTime(value) {

if(!value)return "-";

return new Date(value)
.toLocaleTimeString("th-TH");

}


/* HOME */

function showHome() {

document.getElementById("homePage")
.classList.remove("hidden");

document.getElementById("historyPage")
.classList.add("hidden");

render();

}


/* RENDER */

function render() {

renderCurrentJob();

renderToday();

}


/* TIMER UPDATE */

setInterval(function(){

renderCurrentJob();

},1000);


/* START */

render();

</script>

</body>
</html>
